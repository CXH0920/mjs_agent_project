[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# I（import 排序）与 B905（zip 显式 strict）均可 --fix 自动收敛且零行为变化（K1 首批灰度）；
# E/W 其余规则待统计分布后再决定子集启用。
select = ["F", "T201", "I", "B905"]

[tool.ruff.lint.per-file-ignores]
"src/**/__init__.py" = ["F401"]
# T201（禁 print）：库层（business/data/ocr/ui/capture/config）生效——这些代码会被
# GUI 进程 import，进度一律走 logger。rag/scraper/scripts/tests 混有 CLI 入口的
# print 进度通道，待各目录清理后再逐步收窄忽略范围。
"src/main.py" = ["T201"]
"src/rag/**" = ["T201"]
"src/scraper/**" = ["T201"]
"src/scripts/**" = ["T201"]
"tests/**" = ["T201"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingTypeStubs = "none"
