name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 30 分钟会在测试约 89% 处取消（apt + conda 装配 + 2 核 runner 跑 1000+ 用例），
    # 提至 60 分钟留足余量
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libfontconfig1 libxkbcommon0 libdbus-1-3
      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-${{ hashFiles('environment-ci.yml') }}
          restore-keys: ${{ runner.os }}-conda-
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: myenv
          auto-activate: false
          environment-file: environment-ci.yml
          pkgs-dirs: ~/conda_pkgs_dir
      - name: Lint
        shell: bash -l {0}
        run: python -m ruff check src tests
      # pyright（pyproject 已配 basic 模式）2026-09 实测 src 237 处报错：
      # reportArgumentType 79 / reportOptionalMemberAccess 57 / reportAttributeAccessIssue 46，
      # Optional 系合计约 39%——多为动态模型属性与第三方库缺类型桩，清零属数天级类型治理，
      # 收益/成本不匹配。维持 report-only 留档趋势不阻断；若后续清零，移除
      # continue-on-error 升级为强门禁
      - name: Type check (pyright, report-only)
        continue-on-error: true
        shell: bash -l {0}
        run: python -m pyright
      - name: Test
        shell: bash -l {0}
        env:
          QT_QPA_PLATFORM: offscreen
        # --timeout-method=thread：默认 signal 方法打不断阻塞在 Qt/PySide6 C++ 层的
        # 用例（CI 曾在 92% 处僵死 30+ 分钟）；thread 方法超时后先 dump 全线程栈再
        # 强杀 worker，既能兜底又能留下死锁定位信息
        run: python -m pytest -q -n auto --timeout=60 --timeout-method=thread
      - name: Dump timeout stacks (if any)
        if: always()
        shell: bash -l {0}
        run: |
          shopt -s nullglob
          for f in logs/pytest-timeout-*.log; do
            echo "=== $f ==="
            cat "$f"
          done
