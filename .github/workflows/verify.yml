name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libfontconfig1 libxkbcommon0 libdbus-1-3
      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-${{ hashFiles('environment-ci.yml') }}
          restore-keys: ${{ runner.os }}-conda-
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: myenv
          auto-activate-base: false
          environment-file: environment-ci.yml
          pkgs-dirs: ~/conda_pkgs_dir
      - name: Lint
        shell: bash -l {0}
        run: python -m ruff check src tests
      - name: Test
        shell: bash -l {0}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -n auto --timeout=60
