name: verify

on:
  push:
    # 纯文档推送不触发全量测试；仅当所有变更文件都命中忽略模式才跳过，docs+code 混合推送照常全量跑
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

# 同分支连续推送时取消旧 run，只验最新一次提交
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # 30 分钟会在测试约 89% 处取消（apt + conda 装配 + 2 核 runner 跑 1000+ 用例），
    # 提至 60 分钟留足余量
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libfontconfig1 libxkbcommon0 libdbus-1-3
      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-${{ hashFiles('environment-ci.yml') }}
          restore-keys: ${{ runner.os }}-conda-
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: myenv
          auto-activate: false
          environment-file: environment-ci.yml
          pkgs-dirs: ~/conda_pkgs_dir
      - name: Lint
        shell: bash -l {0}
        run: python -m ruff check src tests
      # 架构契约（.importlinter）：ui-not-infra 的 6 条豁免随修复逐条删除，清零后为纯硬门禁
      - name: Import contracts
        shell: bash -l {0}
        run: lint-imports
      # 死代码扫描（report-only）：约 98 条存量候选待清点，清零后移除 continue-on-error 升级为强门禁
      - name: Dead code scan (vulture, report-only)
        continue-on-error: true
        shell: bash -l {0}
        run: python -m vulture src tests/vulture_whitelist.py --min-confidence 60 --ignore-decorators "@field_validator,@model_validator"
      # pyright（pyproject 已配 basic 模式）2026-09 实测 src 237 处报错：
      # reportArgumentType 79 / reportOptionalMemberAccess 57 / reportAttributeAccessIssue 46，
      # Optional 系合计约 39%——多为动态模型属性与第三方库缺类型桩，清零属数天级类型治理，
      # 收益/成本不匹配。维持 report-only 留档趋势不阻断；若后续清零，移除
      # continue-on-error 升级为强门禁
      - name: Type check (pyright, report-only)
        continue-on-error: true
        shell: bash -l {0}
        run: python -m pyright
      - name: Test
        shell: bash -l {0}
        env:
          QT_QPA_PLATFORM: offscreen
        # --timeout-method=thread：默认 signal 方法打不断阻塞在 Qt/PySide6 C++ 层的
        # 用例（CI 曾在 92% 处僵死 30+ 分钟）；thread 方法超时后先 dump 全线程栈再
        # 强杀 worker，既能兜底又能留下死锁定位信息
        #
        # 真实子进程用例（-m real_process）单独起一个无 xdist 的进程跑：Linux 的
        # QProcess 走 fork()，与 xdist worker 的 execnet I/O 线程及前序用例泄漏
        # 线程并存时存在 Qt 原生竞态，间歇性 SIGSEGV 杀死 worker（重跑即绿）；
        # 独立进程无线程污染，保住 Linux 全链路覆盖。Windows 走 CreateProcess
        # 无此路径，本地全量跑无需拆分。
        #
        # worker 原生崩溃类失败自动串行重跑一次：同 worker 内早前用例泄漏的
        # 原生资源（QThread/handler.close/fork 竞态等，见 conftest 各 fixture
        # 注释的 5 起实证）会把 SIGSEGV 记在"崩溃后恰好泵 Qt 事件的无关用例"
        # 头上（2026-11-06 #286 test_widgets 受害；该用例引入提交 CI 为绿、
        # 次日无关业务提交复现，非用例自身缺陷）。仅当输出含 worker 崩溃签名
        # （node down / crashed while running）才用 --lf 串行重跑失败用例：
        # 间歇崩溃重跑即绿，真实失败换环境仍会红；普通断言失败不触发重跑，
        # 直接红。日志经 tee 落 .tmp_test/xdist_main.log 供签名比对与排查。
        run: |
          set -eo pipefail
          mkdir -p .tmp_test
          if python -m pytest -q -n auto --timeout=60 --timeout-method=thread -m "not real_process" 2>&1 | tee .tmp_test/xdist_main.log; then
            :
          elif grep -qE "node down: Not properly terminated|crashed while running" .tmp_test/xdist_main.log; then
            python -m pytest -q --timeout=60 --timeout-method=thread --lf
          else
            exit 1
          fi
          python -m pytest -q --timeout=60 --timeout-method=thread -m real_process
      - name: Dump timeout stacks (if any)
        if: always()
        shell: bash -l {0}
        run: |
          shopt -s nullglob
          for f in .tmp_test/timeout_dumps/pytest-timeout-*.log; do
            echo "=== $f ==="
            cat "$f"
          done
