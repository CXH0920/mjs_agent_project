# 名将杀 Agent 开发环境
# 使用：conda env create -f environment.yml
name: myenv
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
    - pydantic==2.13.4
    - httpx==0.28.1
    - opencv-python==4.11.0.86
    - PySide6==6.11.1
    - pytest==9.0.3
    - ruff==0.12.0
    # 架构契约检查（.importlinter；配合 tests/test_architecture.py 守护分层）
    - import-linter==2.15
    # 死代码扫描（report-only；白名单见 tests/vulture_whitelist.py）
    - vulture==2.16
    - pillow==12.3.0
    - numpy==1.26.4
    # OCR 引擎（B1 起 RapidOCR/ONNX 唯一栈：v6 主引擎内置模型 + v4 复核引擎，
    # v4 三件套经 src/scripts/fetch_recheck_models.py 官方清单预取，paddle 已退役）
    - rapidocr==3.9.2
    - onnxruntime==1.23.2
    - playwright==1.60.0
    - mistune==3.3.0
    # RAG 向量检索（src/rag/indexer、retriever 惰性导入；缺失时重建索引/检索直接 ImportError）
    - chromadb==1.5.9
    - sentence-transformers==5.7.0
    # 汉字特征库（OCR 矫正用：四角号码、仓颉码、部首、笔画数、拼音）
    - unihan_etl==0.43.0
    - cnradical==0.1.0
    - pypinyin==0.55.0
