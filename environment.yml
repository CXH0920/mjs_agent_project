# 名将杀 Agent 开发环境
# 使用：conda env create -f environment.yml
name: myenv
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
    - pydantic>=2.0
    - httpx>=0.28
    - opencv-python>=4.13
    - PySide6>=6.7
    - pytest>=9.0
    - pillow>=12.0
    - numpy>=2.0
    - paddlepaddle>=2.5
    - paddleocr>=2.7
    - playwright>=1.60
    - mistune>=3.1
    # 汉字特征库（OCR 矫正用：四角号码、仓颉码、部首、笔画数、拼音）
    - unihan_etl>=0.13
    - cnradical>=0.1
    - pypinyin>=0.51
