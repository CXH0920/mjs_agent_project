# 名将杀 Agent 开发环境
# 使用：conda env create -f environment.yml
name: myenv
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
    - pydantic==2.13.4
    - httpx==0.28.1
    - opencv-python==4.11.0.86
    - PySide6==6.11.1
    - pytest==9.0.3
    - ruff==0.12.0
    - pillow==12.3.0
    - numpy==1.26.4
    - paddlepaddle-gpu==2.6.2
    - paddleocr==2.8.1
    - protobuf==3.20.2
    # CUDA 11.8 / cuDNN 8.x 运行时（paddlepaddle-gpu 所需，Windows 下需将 DLL 复制到 paddle/libs）
    - nvidia-cublas-cu11==11.11.3.6
    - nvidia-cuda-runtime-cu11==11.8.89
    - nvidia-cudnn-cu11==8.9.5.29
    - playwright==1.60.0
    - mistune==3.3.0
    # 汉字特征库（OCR 矫正用：四角号码、仓颉码、部首、笔画数、拼音）
    - unihan_etl==0.43.0
    - cnradical==0.1.0
    - pypinyin==0.55.0
