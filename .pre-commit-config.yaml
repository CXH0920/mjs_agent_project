# 提交前本地 lint 门禁：与 .github/workflows/verify.yml 的 Lint 步骤跑同一命令、同一判定。
# 采用 repo: local 直调 myenv 的 ruff——本机直连 github.com 会被重置，
# pre-commit 框架的远程钩子仓库（ruff-pre-commit）拉取不可靠，不依赖代理状态。
# 版本一致性约定：myenv 已与 environment.yml / environment-ci.yml 统一为 ruff==0.12.0，
# 升级 CI ruff 版本时三处需同步，否则钩子与 CI 判定可能分叉。
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check src tests (0.12.0, 与 CI 同版本)
        entry: G:/CONDA/Anaconda3/envs/myenv/python.exe -m ruff check src tests
        language: system
        pass_filenames: false
        # 任何 commit（含纯文档）都全量检查一次，ruff 仅 1~2 秒
        always_run: true
